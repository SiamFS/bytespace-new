# Local development stack.
#   docker compose up -d db        → only Postgres (run the API with `npm run dev` in backend/)
#   docker compose up --build      → Postgres + the API container (production image)
# Redis joins in the auth PR.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: bytespace
      POSTGRES_PASSWORD: bytespace
      POSTGRES_DB: bytespace
    ports:
      # Host port 5433: 5432 is often taken by a locally installed PostgreSQL service.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the separate `bytespace_test` database used by the API tests (first start only).
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bytespace -d bytespace"]
      interval: 5s
      timeout: 2s
      retries: 20

  api:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://bytespace:bytespace@db:5432/bytespace?schema=public
      CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY: "0"
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
