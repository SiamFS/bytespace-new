# Local stack — the whole app in Docker, or just the databases.
#   node scripts/docker-up.mjs          → starts Docker Desktop if needed, then everything below (one command)
#   docker compose up -d --build --wait → Postgres + Redis + API + website (http://localhost:3000)
#   docker compose up -d postgres redis → only the databases (run `npm run dev` in backend/ and frontend/)
#   docker compose down                 → stop (add -v to also delete the database volume)

# Project name (defaults to the folder name). Shown in Docker Desktop and used to prefix
# the network and volumes: bytespace_default, bytespace_postgres-data.
name: bytespace

services:
  postgres:
    image: postgres:17
    # Fixed, readable names instead of <project>-<service>-1. Compose then can't run more than one
    # container per service (Compose docs: container_name) — fine for local development.
    container_name: bytespace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bytespace
      POSTGRES_PASSWORD: bytespace
      POSTGRES_DB: bytespace
    ports:
      # Host port 5433: 5432 is often taken by a locally installed PostgreSQL service.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the separate `bytespace_test` database used by the API tests (first start only).
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bytespace -d bytespace"]
      interval: 5s
      timeout: 2s
      retries: 20

  # Rate-limit store (Upstash in production). Host port 6380 to avoid clashing with a local Redis.
  redis:
    image: redis:7-alpine
    container_name: bytespace-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 20

  backend:
    build: ./backend
    image: bytespace-backend
    container_name: bytespace-backend
    ports:
      - "4000:4000"
    # Optional: your backend/.env adds GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET (Google sign-in).
    # `environment` below wins over it (Compose docs), so the container always uses the
    # Compose database and Redis, never the localhost URLs from that file.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Service names are the hostnames on the Compose network.
      DATABASE_URL: postgresql://bytespace:bytespace@postgres:5432/bytespace?schema=public
      DIRECT_URL: postgresql://bytespace:bytespace@postgres:5432/bytespace?schema=public
      REDIS_URL: redis://redis:6379
      # The website origin. Also the base of the Google redirect URI:
      # http://localhost:3000/api/auth/google/callback
      CORS_ORIGINS: http://localhost:3000
      # Requests come from the website container (one hop).
      TRUST_PROXY: "1"
      LOG_LEVEL: info
      # Local-only secret. Production sets a real one in the host's environment settings.
      JWT_SECRET: local-compose-secret-change-me-32-plus-chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # The website proxies /api/* to this (read at build time).
        API_URL: http://backend:4000
    image: bytespace-frontend
    container_name: bytespace-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
